(function() {
  function wipeUserCache() {
    try {
      sessionStorage.clear();
      var toRemove = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k !== 'af_theme') {
          toRemove.push(k);
        }
      }
      for (var j = 0; j < toRemove.length; j++) {
        localStorage.removeItem(toRemove[j]);
      }
    } catch(e) {}
  }
  // 1. Bersihkan saat pertama dibuka
  wipeUserCache();
  // 2. Bersihkan saat user menutup tab / browser
  window.addEventListener('beforeunload', wipeUserCache);
  window.addEventListener('pagehide', wipeUserCache);
})();
</script>

          if (!/ af-cv/.test(d.className) || !root || !root.hasAttribute('data-ssr')) return;
          var main = root.querySelector('main'), list = [], i;
          if (main) for (i = 2; i < main.children.length; i++) list.push(main.children[i]);
          var ft = root.querySelector(':scope > div > footer'); if (ft) list.push(ft);
          var un = function (el) { el.style.contentVisibility = 'visible'; };
          var all = function () { while (list.length) un(list.shift()); d.className = d.className.replace(' af-cv', ''); };
          if (location.hash && location.hash.length > 1) return all();
          document.addEventListener('click', function (e) { var t = e.target; if (list.length && t && t.closest && t.closest('a[href^="#"]')) all(); }, true);
          var ric = window.requestIdleCallback || function (f) { return setTimeout(function () { f({ timeRemaining: function () { return 8; } }); }, 30); };
          // satu section per giliran → tata letaknya dihitung di frame berikutnya (tugas pendek)
          var step = function () {
            if (list.length) un(list.shift());
            if (list.length) requestAnimationFrame(function () { setTimeout(function () { ric(step, { timeout: 300 }); }, 0); }); else all();
          };
          requestAnimationFrame(function () { setTimeout(function () { ric(step, { timeout: 250 }); }, 0); });
        } catch (e) {}
      })();
    </script>

    <!-- KONFIGURASI white-label (edit /config.js, tanpa build). Dimuat SEBELUM
         bundle agar window.__AF_CONFIG sudah siap saat app jalan. -->
    <script src="/config.js?v=2"></script>
    <script>
      // Footer Social: halaman Facebook sudah ganti nama jadi contentscaleup (15 Okt 2026).
      (function () {
        try {
          var c = window.__AF_CONFIG = window.__AF_CONFIG || {};
          c.facebookUrl = 'https://www.facebook.com/profile.php?id=61590446791266';
          c.facebookHandle = 'contentscaleup';
        } catch (e) {}
      })();
    </script>
    <script>
      // Set judul tab + WARNA brand dari config. Override di-inject sebagai
      // <style> yang HANYA menarget DARK mode (:root:not(.theme-light)) →
      // landing (selalu dark) & /app dark ikut warna config; LIGHT mode di /app
      // tetap pakai tema default (teal/putih). Dijalankan sebelum bundle → no flash.
      (function () {
        try {
          var cfg = window.__AF_CONFIG || {};
          if (cfg.brandName) document.title = cfg.brandName + ' — Instant Design Studio';

          var hexToRgb = function (hex) {
            var h = String(hex).replace('#', '').trim();
            if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
            if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
            return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
          };
          var clamp = function (n) { return Math.max(0, Math.min(255, Math.round(n))); };
          var rgbStr = function (a) { return a[0] + ', ' + a[1] + ', ' + a[2]; };
          var lighten = function (a, p) { return [clamp(a[0] + (255 - a[0]) * p), clamp(a[1] + (255 - a[1]) * p), clamp(a[2] + (255 - a[2]) * p)]; };
          var darken = function (a, p) { return [clamp(a[0] * (1 - p)), clamp(a[1] * (1 - p)), clamp(a[2] * (1 - p))]; };
          var toRgb = function (a) { return 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')'; };

          var rules = [];
          // ACCENT
          var ac = hexToRgb(cfg.accentColor);
          if (ac) {
            // pakai rgb() (selalu valid) — tahan walau user lupa tanda '#'
            rules.push('--accent:' + toRgb(ac) + ';');
            rules.push('--accent-rgb:' + rgbStr(ac) + ';');
            rules.push('--accent-hover:' + toRgb(lighten(ac, 0.18)) + ';');
            rules.push('--accent-deep:' + toRgb(darken(ac, 0.30)) + ';');
            rules.push('--accent-soft:rgba(' + rgbStr(ac) + ',0.20);');
            rules.push('--border:rgba(' + rgbStr(ac) + ',0.22);');
            rules.push('--border-strong:rgba(' + rgbStr(ac) + ',0.42);');
          }
          // BACKGROUND (warna gelap; turunkan 4 shade dari 1 warna dasar)
          var bg = hexToRgb(cfg.bgColor);
          if (bg) {
            rules.push('--bg:' + toRgb(bg) + ';');
            rules.push('--bg-deep:' + toRgb(darken(bg, 0.4)) + ';');
            rules.push('--bg-panel:' + toRgb(lighten(bg, 0.06)) + ';');
            rules.push('--bg-elev:' + toRgb(lighten(bg, 0.12)) + ';');
          }
          if (rules.length) {
            var st = document.createElement('style');
            // :root:not(.theme-light) → menang atas :root (dark) tapi TIDAK kena light mode
            st.textContent = ':root:not(.theme-light){' + rules.join('') + '}';
            document.head.appendChild(st);
          }
        } catch (e) {}
      })();
    </script>


    <!-- Watchdog anti-blank (non-module → jalan bahkan di browser lama):
         1) Setelah 2.5s paksa konten .reveal terlihat — beberapa HP (battery
            saver / "remove animations") mem-pause animasi CSS sehingga konten
            stuck transparan → halaman tampak cuma warna.
         2) Kalau React belum mount setelah 12s (bundle gagal load / gagal parse
            di browser lama), ganti splash jadi tombol Muat Ulang — bukan
            "Loading..." selamanya. -->
    <script>
      (function () {
        setTimeout(function () {
          document.documentElement.className += ' anims-settled';
        }, 1200);
        setTimeout(function () {
          if (!window.__AF_MOUNTED) {
            document.documentElement.className = document.documentElement.className.replace(' af-shell-on', '');
            var el = document.getElementById('initial-loader');
            if (el) {
              el.innerHTML =
                '<div style="text-align:center;font-family:Inter,system-ui,sans-serif;color:#fff;padding:0 24px">' +
                '<div style="font-size:15px;font-weight:700;margin-bottom:6px">Koneksi lambat atau gagal memuat</div>' +
                '<div style="font-size:12px;color:rgba(255,255,255,.6);margin-bottom:16px">Periksa koneksi internetmu, lalu coba lagi.</div>' +
                '<button onclick="location.reload()" style="background:linear-gradient(135deg,#1273eb,#0848b5);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer">&#8635; Muat Ulang</button>' +
                '</div>';
            }
          }
        }, 12000);
      })();
    </script>

    <script>

          if (h.indexOf('app.') === 0 || p === '/app' || p.indexOf('/app/') === 0 || x === '#/app' || x.indexOf('#/app/') === 0) return;
          var s = document.createElement('script');

    <!-- Promo Auto Motion (menu sidebar + popup 1x/hari) — HANYA dimuat di /app,
         landing tidak mengunduh apa pun. File: /am-promo/. Matikan: hapus blok
         ini, atau tambahkan  amPromo: false  di /config.js. -->
    <script>
      (function () {
        try {
          if ((window.__AF_CONFIG || {}).amPromo === false) return;
          var loaded = false;
          var isApp = function () {
            var h = location.host || '', p = location.pathname || '', x = location.hash || '';
            return h.indexOf('app.') === 0 || p === '/app' || p.indexOf('/app/') === 0 || x === '#/app' || x.indexOf('#/app/') === 0;
          };
          var load = function () {
            if (loaded || !isApp()) return;
            loaded = true;
            var s = document.createElement('script');
            s.src = '/am-promo/am-promo.js?v=2';
            s.async = true;
            try { s.fetchPriority = 'low'; } catch (e) {}
            document.body.appendChild(s);
          };
          load();
          if (!loaded) {
            window.addEventListener('hashchange', load);
            window.addEventListener('popstate', load);
          }
        } catch (e) {}
      })();
    </script>
